# dsh-block-hanging-commands: inspect shell commands before they run.
# To change settings, add a row like the one below to
# ~/.dsh/profiles/<profile>/cordis.patch.yml (one profile) or ~/.dsh/cordis.patch.yml
# (every profile). Keys you leave out keep their defaults.
#
# - id: block-hanging-commands
#   config:
#     mode: deny          # or ask
#     tools: [bash, pwsh]
#     pty: false          # true for dsh-tool-bash-persistent
#     disabledRules: []
#     allowPatterns: []
- insert:
    - id: block-hanging-commands
      name: dsh-block-hanging-commands
